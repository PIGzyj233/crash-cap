name: Phase 0 verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_s3_qualification:
        description: "Run Docker-backed RustFS S3 qualification"
        required: false
        type: boolean
        default: false
      run_symbolicator_container:
        description: "Run Docker-backed Symbolicator gateway smoke"
        required: false
        type: boolean
        default: false
      run_windows_fixture:
        description: "Run Windows SDK/CDB fixture generation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lightweight:
    name: Lightweight Phase 0 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - name: Run local Phase 0 aggregator
        run: python scripts/phase0/verify.py --output phase0-verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-verification-${{ github.run_id }}
          path: |
            phase0-verification.json
            phase0-verification.md
          if-no-files-found: error

  s3-qualification:
    name: Manual RustFS S3 qualification
    if: github.event_name == 'workflow_dispatch' && inputs.run_s3_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RustFS qualification suite
        run: bash qualification/s3/run.sh

      - name: Upload RustFS qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-s3-qualification-${{ github.run_id }}
          path: docs/evidence/rustfs-qualification.*
          if-no-files-found: warn

  symbolicator-container:
    name: Manual Symbolicator container smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_symbolicator_container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Compose gateway smoke
        run: python scripts/symbolicator/verify.py --output symbolicator-verification.json

      - name: Upload Symbolicator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolicator-verification-${{ github.run_id }}
          path: symbolicator-verification.json
          if-no-files-found: warn

  windows-fixture:
    name: Manual Windows x64 fixture generation
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_fixture
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"

      - name: Generate and verify all 20 synthetic fixtures
        shell: pwsh
        run: ./scripts/fixtures/build_golden.ps1 -Clean

      - name: Run generated PE/PDB contract tests
        shell: pwsh
        run: cargo test -p crashcap --lib config::tests:: -- --ignored

      - name: Run synthetic runtime harness
        shell: pwsh
        run: >-
          python scripts/fixtures/harness.py
          --exclude-fixture p0-d07-upstream-invalid-parameter
          --expected-golden-count 20
          --output ci-fixture-harness.json

      - name: Upload Windows fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixture-${{ github.run_id }}
          path: |
            ci-fixture-harness.json
            fixtures/*/generated/manifest.json
            fixtures/*/generated/verifier-result.json
          if-no-files-found: warn
