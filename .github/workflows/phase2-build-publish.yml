name: Phase 2 trusted-intranet Build publish

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Crash-Cap Workspace id or exact name"
        required: true
        type: string
      manifest:
        description: "Repository-relative Build Manifest path"
        required: true
        type: string
      artifact_root:
        description: "Repository-relative PE/PDB/source package root"
        required: true
        type: string
      producer:
        description: "Qualified producer (MSVC is the Phase 2 supported baseline)"
        required: true
        default: "msvc"
        type: choice
        options: [msvc]

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, windows, crashcap-intranet]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed native publisher
        shell: pwsh
        run: |
          $binary = "tools/crashcap-ci/windows-x86_64/crashcap-ci.exe"
          $entry = Get-Content "tools/crashcap-ci/SHA256SUMS" |
            Where-Object { $_ -match "  windows-x86_64/crashcap-ci\.exe$" }
          if (@($entry).Count -ne 1) { throw "missing unique Windows checksum entry" }
          $expected = ($entry -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "crashcap-ci.exe SHA-256 mismatch" }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified Build artifacts
        shell: pwsh
        env:
          CRASHCAP_API_URL: ${{ vars.CRASHCAP_API_URL }}
        run: |
          & "tools/crashcap-ci/windows-x86_64/crashcap-ci.exe" `
            --workspace "${{ inputs.workspace }}" `
            --manifest "${{ inputs.manifest }}" `
            --artifact-root "${{ inputs.artifact_root }}" `
            --producer "${{ inputs.producer }}" `
            --producer-build-id "${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
