name: Crash-Cap Build publication

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Repository-relative crashcap.toml path"
        required: true
        default: "crashcap.toml"
        type: string
      profile:
        description: "crashcap.toml profile"
        required: true
        default: "release"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, windows, crashcap-intranet]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed crashcap publisher
        shell: pwsh
        run: |
          $binary = "tools/crashcap/windows-x86_64/crashcap.exe"
          $entry = Get-Content "tools/crashcap/SHA256SUMS" |
            Where-Object { $_ -match "  windows-x86_64/crashcap\.exe$" }
          if (@($entry).Count -ne 1) { throw "missing unique Windows checksum entry" }
          $expected = ($entry -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "crashcap.exe SHA-256 mismatch" }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified Build artifacts
        shell: pwsh
        env:
          CRASHCAP_API_URL: ${{ vars.CRASHCAP_API_URL }}
        run: |
          & "tools/crashcap/windows-x86_64/crashcap.exe" `
            --config "${{ inputs.config }}" `
            --json publish `
            --profile "${{ inputs.profile }}" `
            --origin ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashcap-publication
          path: crashcap-publication.json
          if-no-files-found: ignore
          retention-days: 30
