name: Crash-Cap file upload

on:
  workflow_dispatch:
    inputs:
      files:
        description: "File or directory to upload"
        required: true
        default: "Release"
        type: string
      workspace:
        description: "Workspace ID or exact name"
        required: true
        type: string
      version:
        description: "Optional build version label"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: [self-hosted, windows, crashcap-intranet]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload files and wait for acceptance
        shell: pwsh
        env:
          CRASHCAP_API_URL: ${{ vars.CRASHCAP_API_URL }}
          CRASHCAP_FILES: ${{ inputs.files }}
          CRASHCAP_WORKSPACE: ${{ inputs.workspace }}
          CRASHCAP_BUILD_VERSION: ${{ inputs.version }}
        run: |
          $binary = "tools/crashcap/windows-x86_64/crashcap.exe"
          $entry = Get-Content "tools/crashcap/SHA256SUMS" | Where-Object { $_ -match "  windows-x86_64/crashcap\.exe$" }
          if (@($entry).Count -ne 1) { throw "missing unique Windows checksum entry" }
          if ((Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant() -ne ($entry -split "\s+")[0]) { throw "crashcap.exe SHA-256 mismatch" }
          $uploadArgs = @("upload", $env:CRASHCAP_FILES, "--workspace", $env:CRASHCAP_WORKSPACE, "--json", "--receipt", "crashcap-upload.json")
          if ($env:CRASHCAP_BUILD_VERSION) { $uploadArgs += @("--build-version", $env:CRASHCAP_BUILD_VERSION) }
          & $binary @uploadArgs
          exit $LASTEXITCODE
      - name: Retain per-file upload receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashcap-upload
          path: crashcap-upload.json
          if-no-files-found: ignore
          retention-days: 30
