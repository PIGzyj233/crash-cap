name: Upload v3 verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './platform[dev]'
      - run: python -m ruff check api worker cli tests migrations
        working-directory: platform
      - run: python -m mypy api worker cli
        working-directory: platform
      - run: python -m pytest -m 'not integration and not compose and not capacity'
        working-directory: platform
      - run: python -m unittest discover -s tests/symbolicator -p 'test_*.py'
      - run: python scripts/ci/test_s3_adapter_offline.py
      - run: python scripts/ci/check_markdown_links.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './platform[dev]'
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: platform/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm openapi:check
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm build
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: crashcap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      QAI_CATALOG_DATABASE_URL: postgresql+psycopg://postgres:local-test-only@127.0.0.1:5432/crashcap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './platform[dev]'
      - run: >-
          python -m pytest tests/test_analysis_demands_postgres.py
          tests/test_current_decisions_postgres.py tests/test_symbol_catalog_postgres.py
          tests/test_task_handoff_postgres.py
          -k 'not real and not native' -q
        working-directory: platform
  native-files:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './platform[dev]'
      - run: ./scripts/fixtures/build_golden.ps1 -Clean
        shell: pwsh
      - run: ./scripts/fixtures/build_p0_b01.ps1
        shell: pwsh
      - run: cargo build --locked -p dmp-core
      - run: python -m pytest tests/test_upload_v3.py tests/test_upload_v3_retention.py tests/test_upload_v3_failures.py tests/test_native_upload_cli.py -q
        working-directory: platform
