.crashcap-ci:windows:
  variables:
    CRASHCAP_PRODUCER: "msvc"
  script:
    - |
      $ErrorActionPreference = "Stop"
      foreach ($name in @("CRASHCAP_API_URL", "CRASHCAP_WORKSPACE", "CRASHCAP_MANIFEST", "CRASHCAP_ARTIFACT_ROOT", "CI_PIPELINE_ID")) {
        if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
          throw "required variable is empty: $name"
        }
      }
      $binary = Join-Path $env:CI_PROJECT_DIR "tools/crashcap-ci/windows-x86_64/crashcap-ci.exe"
      $checksums = Join-Path $env:CI_PROJECT_DIR "tools/crashcap-ci/SHA256SUMS"
      $entry = Get-Content $checksums | Where-Object { $_ -match "  windows-x86_64/crashcap-ci\.exe$" }
      if (@($entry).Count -ne 1) { throw "missing unique Windows checksum entry" }
      $expected = ($entry -split "\s+")[0].ToLowerInvariant()
      $actual = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
      if ($actual -ne $expected) { throw "crashcap-ci.exe SHA-256 mismatch" }
      & $binary --workspace $env:CRASHCAP_WORKSPACE --manifest $env:CRASHCAP_MANIFEST --artifact-root $env:CRASHCAP_ARTIFACT_ROOT --producer $env:CRASHCAP_PRODUCER --producer-build-id $env:CI_PIPELINE_ID
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

.crashcap-ci:linux:
  variables:
    CRASHCAP_PRODUCER: "msvc"
  script:
    - |
      set -eu
      : "${CRASHCAP_API_URL:?CRASHCAP_API_URL is required}"
      : "${CRASHCAP_WORKSPACE:?CRASHCAP_WORKSPACE is required}"
      : "${CRASHCAP_MANIFEST:?CRASHCAP_MANIFEST is required}"
      : "${CRASHCAP_ARTIFACT_ROOT:?CRASHCAP_ARTIFACT_ROOT is required}"
      : "${CI_PIPELINE_ID:?CI_PIPELINE_ID is required}"
      cd "$CI_PROJECT_DIR/tools/crashcap-ci"
      grep '  linux-x86_64/crashcap-ci$' SHA256SUMS | sha256sum --check --strict -
      chmod 755 "$CI_PROJECT_DIR/tools/crashcap-ci/linux-x86_64/crashcap-ci"
      "$CI_PROJECT_DIR/tools/crashcap-ci/linux-x86_64/crashcap-ci" \
        --workspace "$CRASHCAP_WORKSPACE" \
        --manifest "$CRASHCAP_MANIFEST" \
        --artifact-root "$CRASHCAP_ARTIFACT_ROOT" \
        --producer "$CRASHCAP_PRODUCER" \
        --producer-build-id "$CI_PIPELINE_ID"
