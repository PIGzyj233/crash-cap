.crashcap:windows:
  variables:
    CRASHCAP_FILES: "Release"
    CRASHCAP_BUILD_VERSION: ""
  script:
    - |
      $ErrorActionPreference = "Stop"
      if (-not $env:CRASHCAP_API_URL -or -not $env:CRASHCAP_WORKSPACE) { throw "CRASHCAP_API_URL and CRASHCAP_WORKSPACE are required" }
      $binary = Join-Path $env:CI_PROJECT_DIR "tools/crashcap/windows-x86_64/crashcap.exe"
      $entry = Get-Content "tools/crashcap/SHA256SUMS" | Where-Object { $_ -match "  windows-x86_64/crashcap\.exe$" }
      if (@($entry).Count -ne 1) { throw "missing unique Windows checksum entry" }
      if ((Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant() -ne ($entry -split "\s+")[0]) { throw "checksum mismatch" }
      $uploadArgs = @("upload", $env:CRASHCAP_FILES, "--workspace", $env:CRASHCAP_WORKSPACE, "--json", "--receipt", "crashcap-upload.json")
      if ($env:CRASHCAP_BUILD_VERSION) { $uploadArgs += @("--build-version", $env:CRASHCAP_BUILD_VERSION) }
      & $binary @uploadArgs
      exit $LASTEXITCODE
  artifacts:
    when: always
    paths: [crashcap-upload.json]
    expire_in: 30 days

.crashcap:linux:
  variables:
    CRASHCAP_FILES: "Release"
    CRASHCAP_BUILD_VERSION: ""
  script:
    - |
      set -eu
      : "${CRASHCAP_API_URL:?CRASHCAP_API_URL is required}"
      : "${CRASHCAP_WORKSPACE:?CRASHCAP_WORKSPACE is required}"
      cd "$CI_PROJECT_DIR/tools/crashcap"
      grep '  linux-x86_64/crashcap$' SHA256SUMS | sha256sum --check --strict -
      cd "$CI_PROJECT_DIR"
      set -- upload "$CRASHCAP_FILES" --workspace "$CRASHCAP_WORKSPACE" --json --receipt crashcap-upload.json
      if [ -n "$CRASHCAP_BUILD_VERSION" ]; then set -- "$@" --build-version "$CRASHCAP_BUILD_VERSION"; fi
      tools/crashcap/linux-x86_64/crashcap "$@"
  artifacts:
    when: always
    paths: [crashcap-upload.json]
    expire_in: 30 days
