[workspace]
members = [
    "core",
    "tests/schema",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
futures-executor = "0.3"
hex = "0.4"
jsonschema = "0.29"
minidump = "0.27"
minidump-processor = "0.27"
minidump-unwind = { version = "0.27", features = ["debuginfo"] }
pdb = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
