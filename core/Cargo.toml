[package]
name = "dmp-core"
version = "1.0.0"
description = "Crash-Cap native minidump inspection and canonical analysis core"
publish = false
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[lib]
name = "dmp_core"
path = "src/lib.rs"

[[bin]]
name = "dmp-core"
path = "src/main.rs"

[dependencies]
crashcap-artifact-identity = { path = "../artifact-identity" }
chrono.workspace = true
clap.workspace = true
futures-executor.workspace = true
hex.workspace = true
jsonschema.workspace = true
minidump.workspace = true
minidump-processor.workspace = true
minidump-unwind.workspace = true
pdb.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }

[dev-dependencies]
tempfile.workspace = true
