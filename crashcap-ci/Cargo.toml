[package]
name = "crashcap"
version = "1.1.0"
description = "Crash-Cap native local and CI Build publisher"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "crashcap"
path = "src/lib.rs"

[[bin]]
name = "crashcap"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
crashcap-artifact-identity = { path = "../artifact-identity" }
reqwest.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile = "3.20"
