services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: crashcap
      POSTGRES_USER: crashcap
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${CRASHCAP_UAT_OUTPUT_DIR:?set a dedicated evidence output directory}:/evidence
    networks:
      - analysis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashcap -d crashcap"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrations:
    build:
      context: ../..
      dockerfile: platform/api/Dockerfile
    image: crash-cap/api:pdb-storage-real-dmp-uat
    entrypoint: ["crashcap-migrate"]
    environment: &database-environment
      CRASHCAP_DATABASE_URL: postgresql+psycopg://crashcap@postgres:5432/crashcap
    networks:
      - analysis
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: crash-cap/api:pdb-storage-real-dmp-uat
    user: "0:0"
    entrypoint: ["python", "/uat/seed_database_zstd_source.py"]
    command: ["${CRASHCAP_UAT_SEED_ACTION:-seed}"]
    environment:
      <<: *database-environment
      CRASHCAP_ENVIRONMENT: test
      CRASHCAP_OBJECT_STORE_BACKEND: local
      CRASHCAP_OBJECT_STORE_LOCAL_ROOT: /objects
      CRASHCAP_SCHEMA_ROOT: /opt/crashcap/contracts
      CRASHCAP_TASK_TMP_ROOT: /tmp/crashcap-tasks
    volumes:
      - blob-objects:/objects
      - ${CRASHCAP_UAT_OUTPUT_DIR:?set a dedicated evidence output directory}:/evidence
      - ../../fixtures/p0-b01-null-read:/fixture:ro
      - ../../scripts/symbolicator/seed_database_zstd_source.py:/uat/seed_database_zstd_source.py:ro
    networks:
      - analysis
    depends_on:
      migrations:
        condition: service_completed_successfully

  symbol-source:
    image: crash-cap/api:pdb-storage-real-dmp-uat
    entrypoint: ["crashcap-symbol-source"]
    environment:
      <<: *database-environment
      CRASHCAP_ENVIRONMENT: test
      CRASHCAP_OBJECT_STORE_BACKEND: local
      CRASHCAP_OBJECT_STORE_LOCAL_ROOT: /objects
      CRASHCAP_SCHEMA_ROOT: /opt/crashcap/contracts
      CRASHCAP_TASK_TMP_ROOT: /var/lib/crashcap/tasks
      PORT: "8081"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/crashcap/tasks:size=128m,mode=1777
    volumes:
      - blob-objects:/objects:ro
    expose:
      - "8081"
    networks:
      - analysis
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5).read()"
      interval: 2s
      timeout: 10s
      retries: 30

  symbolicator:
    image: ghcr.io/getsentry/symbolicator@sha256:9709445e143059f35812a3999370e2354e3a99ef194068ffa4f87bbd491cb959
    command: ["run", "-c", "/etc/symbolicator/config.yml"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - symbolicator-cache:/data
      - ../symbolicator/config-database-zstd-uat.yml:/etc/symbolicator/config.yml:ro
      - ${CRASHCAP_UAT_SYMBOLS_DIR:?set legacy symbols or a dedicated empty directory}:/symbols/workspaces/wsp_01M0VEVHHMTZH6GQB6KTF07XTK:ro
    expose:
      - "3021"
    networks:
      - analysis
    healthcheck:
      test:
        - CMD
        - /bin/symbolicator
        - healthcheck
        - -c
        - /etc/symbolicator/config.yml
        - --timeout
        - "10"
      interval: 2s
      timeout: 15s
      retries: 30

  gateway:
    build:
      context: ../symbolicator
      dockerfile: Dockerfile.gateway
    image: crash-cap/symbolicator-gateway:pdb-storage-real-dmp-uat
    environment:
      SYMBOLICATOR_HOST: symbolicator
      SYMBOLICATOR_PORT: "3021"
      WORKSPACE_SOURCES_ENABLED: "true"
      WORKSPACE_SOURCE_MODE: ${CRASHCAP_UAT_SOURCE_MODE:-http}
      WORKSPACE_SYMBOL_SOURCE_URL: http://symbol-source:8081
      WORKSPACE_SYMBOLS_ROOT: /symbols/workspaces
      MICROSOFT_SYMBOLS_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose:
      - "3021"
    networks:
      - analysis
    depends_on:
      symbol-source:
        condition: service_healthy
      symbolicator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3021/healthcheck', timeout=5).read()"
      interval: 2s
      timeout: 10s
      retries: 30

  core:
    build:
      context: ../..
      dockerfile: deploy/core/Dockerfile
    image: crash-cap/dmp-core:pdb-storage-real-dmp-uat
    volumes:
      - ../../fixtures/p0-b01-null-read:/fixture:ro
      - ${CRASHCAP_UAT_OUTPUT_DIR:?set a dedicated evidence output directory}:/evidence
    networks:
      - analysis
    depends_on:
      gateway:
        condition: service_healthy

networks:
  analysis:
    internal: true

volumes:
  postgres-data:
  blob-objects:
  symbolicator-cache:
