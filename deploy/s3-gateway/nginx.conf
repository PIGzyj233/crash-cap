worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Never log a presigned query string. Host is safe and proves which public
    # endpoint the browser actually used without retaining SigV4 credentials.
    log_format s3_gateway '$request_method $uri host=$http_host '
                          'status=$status bytes=$body_bytes_sent';
    access_log /dev/stdout s3_gateway;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 9000;
        server_name _;

        client_max_body_size 256m;

        location / {
            # No URI suffix is intentional: nginx forwards the original path
            # and query exactly as signed by the public-endpoint S3 client.
            proxy_pass http://rustfs:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
