bind: 0.0.0.0:3021
cache_dir: /data

logging:
  level: info
  format: simplified
  enable_backtraces: true

metrics:
  statsd: "${SYMBOLICATOR_STATSD_ADDR}"
  prefix: symbolicator

symstore_proxy: false
connect_to_reserved_ips: false
max_concurrent_requests: 8
max_download_timeout: 300s
streaming_timeout: 600s

# Microsoft object files and derived SymCaches are public, deployment-owned
# accelerators. Keep warm entries long enough to amortize downloads across
# Workspaces while retaining a bounded cleanup policy.
caches:
  downloaded:
    max_unused_for: 30d
    retry_misses_after: 1h
    retry_malformed_after: 24h
  derived:
    max_unused_for: 30d
    retry_misses_after: 1h
    retry_malformed_after: 24h

sources:
  - id: crash-cap:p0-test
    type: filesystem
    path: /symbols/workspaces/p0-test
    layout:
      type: unified
      casing: lowercase
    filters:
      filetypes: [pe, pdb]
    is_public: false

  - id: crash-cap:microsoft
    type: http
    url: https://msdl.microsoft.com/download/symbols/
    layout:
      type: symstore
    filters:
      filetypes: [pe, pdb, portablepdb]
    is_public: true
