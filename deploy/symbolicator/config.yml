bind: 0.0.0.0:3021
cache_dir: /data

logging:
  level: info
  format: simplified
  enable_backtraces: true

metrics:
  statsd: "${SYMBOLICATOR_STATSD_ADDR}"
  prefix: symbolicator

symstore_proxy: true
# Request-owned sources remain forbidden by the policy gateway. This permits
# only deployment-owned HTTP sources on the isolated analysis network.
connect_to_reserved_ips: true
max_concurrent_requests: 8
max_download_timeout: 300s
streaming_timeout: 600s

# Keep successful content caches across restarts. A failed fetch must expire
# before the platform's first retry (30 seconds); failures are classified by Core.
caches:
  downloaded:
    max_unused_for: null
    retry_misses_after: 1s
    retry_misses_after_public: 1s
    retry_malformed_after: 24h
  derived:
    max_unused_for: null
    retry_misses_after: 1s
    retry_misses_after_public: 1s
    retry_malformed_after: 24h

# The proxy supplies only Microsoft PE bytes for identity-checked local unwind.
# Symbolication requests still explicitly supply their frozen sources. Core
# calls the proxy only for complete `none` selections under the exact default
# Microsoft policy; conflicts/withdrawals never use it.
sources:
  - id: crash-cap:microsoft
    type: http
    url: https://msdl.microsoft.com/download/symbols/
    layout:
      type: symstore
    filters:
      filetypes: [pe]
    is_public: true
