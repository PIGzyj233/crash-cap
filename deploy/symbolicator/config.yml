bind: 0.0.0.0:3021
cache_dir: /data

logging:
  level: info
  format: simplified
  enable_backtraces: true

metrics:
  statsd: "${SYMBOLICATOR_STATSD_ADDR}"
  prefix: symbolicator

symstore_proxy: false
# Request-owned sources remain forbidden by the policy gateway. This permits
# only deployment-owned HTTP sources on the isolated analysis network.
connect_to_reserved_ips: true
max_concurrent_requests: 8
max_download_timeout: 300s
streaming_timeout: 600s

# Downloaded object files are reproducible from authoritative Blob storage or
# Microsoft and are intentionally shorter-lived than derived SymCaches.
caches:
  downloaded:
    max_unused_for: 3d
    retry_misses_after: 1h
    retry_malformed_after: 24h
  derived:
    max_unused_for: 30d
    retry_misses_after: 1h
    retry_malformed_after: 24h

sources:
  - id: crash-cap:p0-test
    type: filesystem
    path: /symbols/workspaces/p0-test
    layout:
      type: unified
      casing: lowercase
    filters:
      filetypes: [pe, pdb]
    is_public: false

  - id: crash-cap:microsoft
    type: http
    url: https://msdl.microsoft.com/download/symbols/
    layout:
      type: symstore
    filters:
      filetypes: [pe, pdb, portablepdb]
    is_public: true
